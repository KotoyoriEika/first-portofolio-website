<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portofolio — Biodata</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              display: ["Sora", "sans-serif"],
              body: ["Inter", "sans-serif"],
            },
            colors: {
              navy: { DEFAULT: "#31153D", panel: "#3D1522", border: "#5A2A3D" },
              pink: "#FE019A",
              coral: "#F2965C",
              cream: "#F5F3EE",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body
    class="font-body bg-cream text-navy dark:bg-navy dark:text-cream transition-colors duration-300 min-h-screen flex flex-col"
  >
    <header
      class="flex items-center justify-between px-6 sm:px-12 py-5 border-b border-navy/10 dark:border-navy-border"
    >
      <a
        href="index.html"
        class="inline-flex items-center gap-2 text-sm font-medium hover:text-pink transition-colors"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 19l-7-7 7-7"
          />
        </svg>
        Kembali ke Beranda
      </a>

      <button
        id="darkModeToggle"
        aria-label="Ganti mode gelap/terang"
        class="w-11 h-11 grid place-items-center rounded-full border border-navy/20 dark:border-navy-border hover:border-pink transition-colors"
      >
        <svg
          id="iconMoon"
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"
          />
        </svg>
        <svg
          id="iconSun"
          class="w-5 h-5 hidden"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          viewBox="0 0 24 24"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            stroke-linecap="round"
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      </button>
    </header>

    <main class="flex-1 px-6 sm:px-12 py-14 sm:py-20 max-w-4xl mx-auto w-full">
      <p class="font-display text-pink font-semibold tracking-wide mb-2">
        Biodata
      </p>
      <h1 class="font-display font-extrabold text-3xl sm:text-4xl mb-10">
        about me
      </h1>

      <div class="flex flex-col sm:flex-row gap-8 sm:gap-12 items-start">
        <div
          class="w-40 h-40 sm:w-52 sm:h-52 shrink-0 mx-auto sm:mx-0 rounded-2xl overflow-hidden border-4 border-pink/70 shadow-lg"
        >
          <!-- Ganti src di bawah dengan foto asli -->
          <img
            src="https://placehold.co/400x400/1B2340/F5F3EE?text=Foto+Kamu"
            alt="Foto profil"
            class="w-full h-full object-cover"
          />
        </div>

        <dl class="flex-1 grid grid-cols-1 gap-6 w-full">
          <div class="border-b border-navy/10 dark:border-navy-border pb-4">
            <dt class="text-sm text-navy/50 dark:text-cream/50 mb-1">Nama</dt>
            <dd class="font-display font-semibold text-xl">Kenia Siahaya</dd>
          </div>

          <div class="border-b border-navy/10 dark:border-navy-border pb-4">
            <dt class="text-sm text-navy/50 dark:text-cream/50 mb-1">
              Birth date
            </dt>
            <dd class="font-display font-semibold text-xl">20 July 2006</dd>
          </div>

          <div class="border-b border-navy/10 dark:border-navy-border pb-4">
            <dt class="text-sm text-navy/50 dark:text-cream/50 mb-1">
              Pendidikan Saat Ini
            </dt>
            <dd class="font-display font-semibold text-xl">
              Computer Science Student at Universitas Pendidikan Ganesha
            </dd>
          </div>

          <div>
            <dt class="text-sm text-navy/50 dark:text-cream/50 mb-2">
              Ketertarikan
            </dt>
            <dd class="flex flex-wrap gap-2">
              <span
                class="px-3 py-1.5 rounded-full text-sm bg-pink/15 text-pink font-medium"
                >Digital Illustration</span
              >
              <span
                class="px-3 py-1.5 rounded-full text-sm bg-pink/15 text-pink font-medium"
                >UI/UX Design</span
              >
              <span
                class="px-3 py-1.5 rounded-full text-sm bg-pink/15 text-pink font-medium"
                >House Music</span
              >
              <span
                class="px-3 py-1.5 rounded-full text-sm bg-pink/15 text-pink font-medium"
                >Data</span
              >
            </dd>
          </div>
        </dl>
      </div>
    </main>

    <footer
      class="px-6 sm:px-12 py-8 text-center text-sm text-navy/50 dark:text-cream/40 border-t border-navy/10 dark:border-navy-border"
    >
      feel free to explore!
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
