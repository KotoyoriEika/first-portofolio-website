<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portofolio — Beranda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              display: ["Sora", "sans-serif"],
              body: ["Inter", "sans-serif"],
            },
            colors: {
              navy: {
                DEFAULT: "#31153D",
                panel: "#3D1522",
                border: "#5A2A3D",
              },
              pink: "#FE019A",
              coral: "#F4C2C2",
              cream: "#F5F3EE",
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body
    class="font-body bg-cream text-navy dark:bg-navy dark:text-cream transition-colors duration-300"
  >
    <!-- Navigasi -->
    <header
      class="flex items-center justify-between px-6 sm:px-12 py-5 border-b border-navy/10 dark:border-navy-border"
    >
      <span class="font-display font-bold text-lg tracking-tight">
        Kenia's Portofolio<span class="text-pink">.</span>
      </span>

      <button
        id="darkModeToggle"
        aria-label="Ganti mode gelap/terang"
        class="w-11 h-11 grid place-items-center rounded-full border border-navy/20 dark:border-navy-border hover:border-pink transition-colors"
      >
        <svg
          id="iconMoon"
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"
          />
        </svg>

        <svg
          id="iconSun"
          class="w-5 h-5 hidden"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          viewBox="0 0 24 24"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            stroke-linecap="round"
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      </button>
    </header>

    <!-- Profil -->
    <section class="px-6 sm:px-12 py-16 sm:py-24 text-center max-w-3xl mx-auto">
      <div
        class="w-36 h-36 sm:w-44 sm:h-44 mx-auto mb-8 rounded-full overflow-hidden border-4 border-pink/70 shadow-lg"
      >
        <img
          src="images/landing_page_image.JPG"
          alt="Foto profil"
          class="w-full h-full object-cover"
        />
      </div>

      <p class="font-display text-pink font-semibold tracking-wide mb-3">
        Hello, i'm
      </p>

      <h1
        class="font-display font-extrabold text-4xl sm:text-5xl leading-tight mb-4"
      >
        Kenia
      </h1>

      <p
        class="text-base sm:text-lg text-navy/70 dark:text-cream/70 leading-relaxed"
      >
        Welcome to my portofolio!
      </p>
    </section>

    <!-- Kumpulan card -->
    <section class="px-6 sm:px-12 pb-20 sm:pb-28 max-w-5xl mx-auto">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
        <!-- Biodata -->
        <a
          href="profile.html"
          class="group relative overflow-hidden rounded-2xl bg-navy-panel/5 dark:bg-navy-panel p-6 flex flex-col gap-3 hover:-translate-y-1 transition-transform duration-300"
        >
          <img
            src="images/biodata.png"
            alt=""
            class="absolute inset-0 w-full h-full object-cover opacity-30 dark:opacity-30 pointer-events-none"
          />

          <span
            class="relative z-10 w-10 h-10 rounded-full bg-pink/15 grid place-items-center text-pink"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              viewBox="0 0 24 24"
            >
              <circle cx="12" cy="8" r="3.5" />
              <path
                stroke-linecap="round"
                d="M4.5 20c1.7-3.5 4.6-5.3 7.5-5.3s5.8 1.8 7.5 5.3"
              />
            </svg>
          </span>

          <span class="relative z-10 font-display font-semibold text-lg">
            Biodata
          </span>

          <span class="relative z-10 text-sm text-navy/60 dark:text-cream/60">
            Get to know me!
          </span>
        </a>

        <!-- Social Media Designs -->
        <a
          href="social.html"
          class="group relative overflow-hidden rounded-2xl bg-navy-panel/5 dark:bg-navy-panel p-6 flex flex-col gap-3 hover:-translate-y-1 transition-transform duration-300"
        >
          <img
            src="images/socialmediaicon.png"
            alt=""
            class="absolute inset-0 w-full h-full object-cover opacity-30 dark:opacity-30 pointer-events-none"
          />

          <span
            class="relative z-10 w-10 h-10 rounded-full bg-pink/15 grid place-items-center text-pink"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              viewBox="0 0 24 24"
            >
              <rect x="3.5" y="3.5" width="17" height="17" rx="4" />
              <circle cx="12" cy="12" r="3.5" />
              <circle
                cx="16.7"
                cy="7.3"
                r=".8"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </span>

          <span class="relative z-10 font-display font-semibold text-lg">
            Social Media Designs
          </span>

          <span class="relative z-10 text-sm text-navy/60 dark:text-cream/60">
            Compilations of my social media designs
          </span>
        </a>

        <!-- Poster Designs -->
        <a
          href="poster.html"
          class="group relative overflow-hidden rounded-2xl bg-navy-panel/5 dark:bg-navy-panel p-6 flex flex-col gap-3 hover:-translate-y-1 transition-transform duration-300"
        >
          <img
            src="images/essayposter.png"
            alt=""
            class="absolute inset-0 w-full h-full object-cover opacity-30 dark:opacity-30 pointer-events-none"
          />

          <span
            class="relative z-10 w-10 h-10 rounded-full bg-pink/15 grid place-items-center text-pink"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              viewBox="0 0 24 24"
            >
              <rect x="5" y="3" width="14" height="18" rx="1.5" />
              <path stroke-linecap="round" d="M8.5 8h7M8.5 12h7M8.5 16h4" />
            </svg>
          </span>

          <span class="relative z-10 font-display font-semibold text-lg">
            Poster Designs
          </span>

          <span class="relative z-10 text-sm text-navy/60 dark:text-cream/60">
            Recent poster designs
          </span>
        </a>

        <!-- GitHub Profile -->
        <a
          href="https://github.com/KotoyoriEika"
          target="_blank"
          rel="noopener noreferrer"
          class="group relative overflow-hidden rounded-2xl bg-navy text-cream dark:bg-pink dark:text-navy p-6 flex flex-col gap-3 hover:-translate-y-1 transition-transform duration-300"
        >
          <img
            src="images/github.png"
            alt=""
            class="absolute inset-0 w-full h-full object-cover opacity-30 pointer-events-none"
          />

          <span
            class="relative z-10 w-10 h-10 rounded-full bg-cream/15 dark:bg-navy/15 grid place-items-center"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M12 .5C5.7.5.9 5.3.9 11.6c0 5 3.2 9.2 7.7 10.7.6.1.8-.2.8-.6v-2.2c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.2-5.1-5.5 0-1.2.4-2.2.1-3 0 0 .9-.3 3 1.1a10.4 10.4 0 0 1 5.4 0c2.1-1.4 3-1.1 3-1.1.6 1.6.2 2.7.1 3 .7.8 1.1 1.8 1.1 3 0 4.3-2.6 5.2-5.1 5.5.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6 4.5-1.5 7.7-5.7 7.7-10.7C23.1 5.3 18.3.5 12 .5Z"
              />
            </svg>
          </span>

          <span class="relative z-10 font-display font-semibold text-lg">
            GitHub Profile
          </span>

          <span class="relative z-10 text-sm opacity-70">
            Let's be friends here!
          </span>
        </a>

        <!-- Y2K Website: sudah masuk ke dalam grid -->
        <a
          href="https://fashion-princess-y2k-fashion-haven.vercel.app/"
          target="_blank"
          rel="noopener noreferrer"
          class="group relative overflow-hidden rounded-2xl bg-navy text-cream dark:bg-pink dark:text-navy p-6 flex flex-col gap-3 hover:-translate-y-1 transition-transform duration-300"
        >
          <img
            src="images/y2k.png"
            alt=""
            class="absolute inset-0 w-full h-full object-cover opacity-30 pointer-events-none"
          />

          <span
            class="relative z-10 w-10 h-10 rounded-full bg-cream/15 dark:bg-navy/15 grid place-items-center"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M12 .5C5.7.5.9 5.3.9 11.6c0 5 3.2 9.2 7.7 10.7.6.1.8-.2.8-.6v-2.2c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.2-5.1-5.5 0-1.2.4-2.2.1-3 0 0 .9-.3 3 1.1a10.4 10.4 0 0 1 5.4 0c2.1-1.4 3-1.1 3-1.1.6 1.6.2 2.7.1 3 .7.8 1.1 1.8 1.1 3 0 4.3-2.6 5.2-5.1 5.5.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6 4.5-1.5 7.7-5.7 7.7-10.7C23.1 5.3 18.3.5 12 .5Z"
              />
            </svg>
          </span>

          <span class="relative z-10 font-display font-semibold text-lg">
            Y2K website
          </span>

          <span class="relative z-10 text-sm opacity-70">
            See my Y2k inspired e-commerce
          </span>
        </a>
      </div>
    </section>

    <!-- Footer -->
    <footer
      class="px-6 sm:px-12 py-8 text-center text-sm text-navy/50 dark:text-cream/40 border-t border-navy/10 dark:border-navy-border"
    >
      feel free to explore!
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
